name: Build & Publish Design System

on:
  release:
    types: [published] # Triggers only when you publish a release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to upload to GitHub Packages
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@radheshyam-dangi'

      - name: Install Dependencies
        run: npm ci

      - name: Set Package Version from Release Tag
        # If your release tag is v1.0.1, this strips the 'v' and sets package version to 1.0.1
        run: |
          VERSION=${{ github.event.release.tag_name }}
          VERSION=${VERSION#v}
          npm version $VERSION --no-git-tag-version

      - name: Build Design System Assets
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}